{% extends "base.html" %}

{% block title %}Анфиса для друзей. Каталог мороженого{% endblock %}

{% block content %}
  <h1>Каталог мороженого</h1>

  <ul>
    {% for item in ice_creams %}
      <li>
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </li>
      
      {% if not forloop.last %}
        <hr>
      {% endif %}
    {% endfor %}
  </ul>
{% endblock %}
