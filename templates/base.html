<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <!-- ОБЯЗАТЕЛЬНО: загружаем библиотеку static в самом верху head -->
    {% load static %}
    
    <title>{% block title %}Анфиса для друзей{% endblock %}</title>
    
    <!-- Подключаем Bootstrap из папки static_dev/css/ -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    
    <!-- Подключаем favicon (предположим, что файл называется favicon.ico в папке favicons/) -->
    <link rel="icon" type="image/png" href="{% static 'favicons/favicon.ico' %}">
  </head>
  <body>
    <!-- Подключаем шапку -->
    {% include "includes/header.html" %}

    <main class="container mt-4">
      {% block content %}{% endblock %}
    </main>

    <!-- Подключаем подвал -->
    {% include "includes/footer.html" %}
  </body>
</html>
